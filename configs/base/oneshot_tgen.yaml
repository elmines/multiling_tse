seed_everything: 0 
trainer:
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: ./

  # No early stopping-- He just does 5 epochs
  max_epochs: 5 

  val_check_interval: 500

  callbacks:
    - class_path: mtse.callbacks.TSEStatsCallback
      init_args:
        full_metrics: true

    # Monitor the stance F1
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/tse/f1
        mode: max
        filename: "epoch={epoch:02d}-tse_f1={val/tse/f1:.3f}"
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/tse/f1
        patience: 5
        mode: max


model:
  class_path: mtse.modules.TGOneShotModule
  init_args:
    targets_path: static/classic_merged_targets.txt
    stance_type: tri

data:
  class_path: mtse.data.OneshotTgenDataModule
  init_args:
    batch_size: 32

    keyword_train_corpus:
      class_path: mtse.data.StanceCorpus
      init_args:
        patts: [data/kptimes/train.jsonl]
        corpus_type: kptimes
        transforms: [ {"class_path": "mtse.data.ClassicPreprocess"} ]

        # About 51,000 samples in the stance train corpus,
        # so we roughly match that here
        limit_n: 51000

    stance_val_corpus:
      class_path: mtse.data.StanceCorpus
      init_args:
        patts: [data/classic/*.val.csv]
        transforms: [ {"class_path": "mtse.data.ClassicPreprocess"} ]

    stance_train_corpus:
      class_path: mtse.data.StanceCorpus
      init_args:
        patts: [data/classic/*.train.csv]
        transforms: [ {"class_path": "mtse.data.ClassicPreprocess"} ]

