seed_everything: 0 # His seeds were 0,112,343
trainer:
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: ./

  # No early stopping-- He just does 5 epochs
  max_epochs: 5 

  # He does use model checkpointing for his stance training
  # But he uses F1 score for just stance (not the targets)
  callbacks:

    - class_path: mtse.callbacks.TSEStatsCallback
      init_args:
        full_metrics: true

    # Monitor the stance F1
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/tse/f1
        mode: max
        filename: "epoch={epoch:02d}-tse_f1={val/tse/f1:.3f}"
        auto_insert_metric_name: false


  # He didn't specify, so neither will we
  deterministic: null

model:
  class_path: mtse.modules.OneShotTClsModule
  init_args:
    targets_path: static/classic_merged_targets.txt
    stance_type: tri

data:
  class_path: mtse.data.PattDataModule
  init_args:
    batch_size: 64
    transforms: [ {"class_path": "mtse.data.ClassicPreprocess"} ]
    train_corpus: data/classic/*.train.csv 
    val_corpus:   data/classic/*.val.csv
    test_corpora:  [data/classic/*.test.csv]